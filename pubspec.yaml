name: ihm
description: "Ware IoT — IHM portátil Modbus TCP: monte telas de operação no celular."
publish_to: 'none'

# versionName+versionCode do Android. O número depois do + sobe a cada envio
# para a Play Store (ela recusa código repetido).
version: 1.4.0+12

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # Textos do próprio Flutter em português (licenças, dicas dos botões,
  # copiar/colar, leitor de tela). Sem isto saíam em inglês.
  flutter_localizations:
    sdk: flutter

  # Pasta privada do app, onde o projeto (.ihm.json) é salvo.
  path_provider: ^2.1.6
  # Exportar/importar projeto e escolher imagem para o elemento Imagem.
  file_picker: ^13.1.0
  # Logs da pilha Modbus e do runtime.
  logging: ^1.3.0
  # Marcas pequenas por aparelho: tutorial visto (com versão na chave).
  shared_preferences: ^2.5.5
  printing: ^5.15.1
  share_plus: ^13.3.0
  clock: ^1.1.3
  # Avisos de alarme por voz no fone (fila própria em Dart: VoiceAnnouncer).
  flutter_tts: ^4.2.5
  # Cliente MQTT 3.1.1 (Dart puro, MIT) para equipamento que publica num broker.
  mqtt_client: ^10.12.0
  # Registro de dados (Mais → Registros): o SQLite do próprio Android, sem
  # biblioteca nativa no APK.
  sqflite: ^2.4.4+1
  # Senha das câmeras IP no cofre do Android (Keystore), nunca no projeto.
  # O vídeo das câmeras não vem de pacote: é o ExoPlayer (Media3) direto,
  # em android/app/.../CameraRtsp.kt.
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Relógio e timers controlados nos testes da fila de voz (repetição de 30 s).
  fake_async: ^1.3.3
  # SQLite nos testes (o flutter test roda no Windows). Só aqui de propósito:
  # o build release não roda hooks de dev_dependencies, então o SQLite que ele
  # embute não vai para o APK. Versão Windows do app: mover para dependencies
  # e usar `databaseFactoryFfi` no main.dart.
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  # IBM Plex (licença OFL): Sans para texto, Condensed para títulos e rótulos
  # de elemento, Mono para números — dígitos de largura fixa não "pulam"
  # quando o valor muda.
  fonts:
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSans-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-700.ttf
          weight: 700
    - family: PlexCondensed
      fonts:
        - asset: assets/fonts/IBMPlexSansCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansCondensed-Bold.ttf
          weight: 700
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
