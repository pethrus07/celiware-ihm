name: ihm
description: "Celiware IHM — IHM portátil Modbus TCP: monte telas de operação no celular."
publish_to: 'none'

# versionName+versionCode do Android. O número depois do + sobe a cada envio
# para a Play Store (ela recusa código repetido).
version: 1.3.0+5

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Pasta privada do app, onde o projeto (.ihm.json) é salvo.
  path_provider: ^2.1.6
  # Exportar/importar projeto e escolher imagem para o elemento Imagem.
  file_picker: ^13.1.0
  # Logs da pilha Modbus e do runtime.
  logging: ^1.3.0
  # Marcas pequenas por aparelho: tutorial visto (com versão na chave).
  shared_preferences: ^2.5.5
  printing: ^5.15.1
  share_plus: ^13.3.0
  clock: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # IBM Plex (licença OFL): Sans para texto, Condensed para títulos e rótulos
  # de elemento, Mono para números — dígitos de largura fixa não "pulam"
  # quando o valor muda.
  fonts:
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSans-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-700.ttf
          weight: 700
    - family: PlexCondensed
      fonts:
        - asset: assets/fonts/IBMPlexSansCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansCondensed-Bold.ttf
          weight: 700
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
